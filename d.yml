          package com.shashwat.hackwall;

          import static com.shashwat.hackwall.Fx.*;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.DashPathEffect;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.SweepGradient;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.provider.MediaStore;
          import android.view.HapticFeedbackConstants;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.Random;

          /**
           * Full-screen hacker console that can show over the lock screen.
           * Flow: boot -> simulated face scan -> passcode (fake, set in the app) -> access granted -> console.
           * No passcode in time (or too many wrong tries) -> AUTHENTICATION FAILED.
           * Everything here is a visual simulation: it does not unlock the phone and never sees your real PIN.
           */
          public class ConsoleActivity extends Activity {
              static final String PREFS = "hackprefs";

              ConsoleView cv;
              BroadcastReceiver offRx;
              CameraManager cm;
              CameraManager.TorchCallback torchCb;
              boolean torchOn = false;
              final Handler handler = new Handler(Looper.getMainLooper());

              static String passcode(Context c) {
                  String s = c.getSharedPreferences(PREFS, MODE_PRIVATE).getString("passcode", "1337");
                  return (s == null || s.length() != 4) ? "1337" : s;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setShowWhenLocked(true);
                  setTurnScreenOn(true);
                  Window w = getWindow();
                  w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  WindowManager.LayoutParams lp = w.getAttributes();
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  w.setAttributes(lp);
                  cv = new ConsoleView(this);
                  setContentView(cv);
                  immersive();

                  offRx = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context c, Intent i) {
                          finish();
                      }
                  };
                  try {
                      registerReceiver(offRx, new IntentFilter(Intent.ACTION_SCREEN_OFF));
                  } catch (Exception ignored) {
                  }
                  try {
                      cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                      torchCb = new CameraManager.TorchCallback() {
                          @Override
                          public void onTorchModeChanged(String cameraId, boolean enabled) {
                              torchOn = enabled;
                          }
                      };
                      cm.registerTorchCallback(torchCb, handler);
                  } catch (Exception ignored) {
                  }
              }

              void immersive() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      getWindow().setDecorFitsSystemWindows(false);
                      WindowInsetsController wc = getWindow().getInsetsController();
                      if (wc != null) {
                          wc.hide(WindowInsets.Type.systemBars());
                          wc.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) immersive();
              }

              @Override
              public void onBackPressed() {
                  finish();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  try {
                      unregisterReceiver(offRx);
                  } catch (Exception ignored) {
                  }
                  try {
                      if (cm != null && torchCb != null) cm.unregisterTorchCallback(torchCb);
                  } catch (Exception ignored) {
                  }
              }

              // ---------------- actions ----------------

              void toggleTorch() {
                  try {
                      if (cm == null) return;
                      for (String id : cm.getCameraIdList()) {
                          CameraCharacteristics cc = cm.getCameraCharacteristics(id);
                          Boolean flash = cc.get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                          Integer lens = cc.get(CameraCharacteristics.LENS_FACING);
                          if (Boolean.TRUE.equals(flash) && lens != null
                                  && lens == CameraCharacteristics.LENS_FACING_BACK) {
                              torchOn = !torchOn;
                              cm.setTorchMode(id, torchOn);
                              return;
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }

              /** Asks Android to unlock for real (PIN / fingerprint), then runs r. */
              void unlockThen(final Runnable r) {
                  KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                  if (km != null && km.isKeyguardLocked()) {
                      km.requestDismissKeyguard(this, new KeyguardManager.KeyguardDismissCallback() {
                          @Override
                          public void onDismissSucceeded() {
                              r.run();
                          }
                      });
                  } else {
                      r.run();
                  }
              }

              void openDialer() {
                  unlockThen(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Intent i = new Intent(Intent.ACTION_DIAL);
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                              finish();
                          } catch (Exception ignored) {
                          }
                      }
                  });
              }

              void openCamera() {
                  KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                  boolean locked = km != null && km.isKeyguardLocked();
                  try {
                      Intent i = new Intent(locked ? MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA_SECURE
                              : MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                      finish();
                  } catch (Exception e) {
                      unlockThen(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  Intent i = new Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA);
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(i);
                                  finish();
                              } catch (Exception ignored) {
                              }
                          }
                      });
                  }
              }

