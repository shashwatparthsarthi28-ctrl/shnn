                  void emblem(Canvas c, float t) {
                      float cx = ECX, cy = ECY;

                      for (int k = 0; k < 2; k++) {
                          float ph = ((t / 3f) + k * 0.5f) % 1f;
                          stroke(a(G, (int) ((1 - ph) * 150)), 2f);
                          c.drawCircle(cx, cy, 60 + ph * 190, p);
                      }

                      // radar sweep over the inner disc
                      c.save();
                      c.translate(cx, cy);
                      c.rotate((t * 100f) % 360f);
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(sweep);
                      c.drawCircle(0, 0, 196, p);
                      p.setShader(null);
                      c.restore();

                      // vertical scan band across the eye, clipped to the disc
                      c.save();
                      path.reset();
                      path.addCircle(cx, cy, 194, Path.Direction.CW);
                      c.clipPath(path);
                      float u = (t * 0.45f) % 2f;
                      if (u > 1f) u = 2f - u;
                      float by = cy - 194 + u * 388f;
                      c.translate(0, by);
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(band);
                      c.drawRect(cx - 194, -34, cx + 194, 34, p);
                      p.setShader(null);
                      stroke(a(G, 230), 2f);
                      c.drawLine(cx - 194, 0, cx + 194, 0, p);
                      c.restore();

                      // pulsing glow on the eye
                      float pulse = 0.5f + 0.5f * (float) Math.sin(t * 2.2f);
                      c.save();
                      c.translate(cx, cy + 10);
                      float gs = 0.5f + 0.5f * pulse;
                      c.scale(gs, gs);
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(glow);
                      c.drawCircle(0, 0, 100, p);
                      p.setShader(null);
                      c.restore();

                      // rotating real ring texture
                      if (ringBmp != null) {
                          c.save();
                          c.rotate((t * 14f) % 360f, cx, cy);
                          c.drawBitmap(ringBmp, cx - Emblem.RING_R, cy - Emblem.RING_R, bp);
                          c.restore();
                      }
                      stroke(a(G, 150), 1.5f);
                      c.drawLine(cx, cy - 250, cx, cy - 190, p);
                      c.drawLine(cx, cy + 190, cx, cy + 250, p);
                      c.drawLine(cx - 250, cy, cx - 190, cy, p);
                      c.drawLine(cx + 190, cy, cx + 250, cy, p);

                      // green arcs riding on the ring
                      rect.set(cx - 212, cy - 212, cx + 212, cy + 212);
                      stroke(G, 6f);
                      c.drawArc(rect, t * 60f, 45, false, p);
                      c.drawArc(rect, t * 60f + 180f, 45, false, p);

                      // dashed outer ring + rotating ticks
                      stroke(a(G, 210), 3f);
                      p.setPathEffect(new DashPathEffect(new float[]{22, 10}, t * 40f));
                      c.drawCircle(cx, cy, 240, p);
                      p.setPathEffect(null);
                      c.save();
                      c.translate(cx, cy);
                      c.rotate(-(t * 9f) % 360f);
                      stroke(a(G, 170), 1.5f);
                      c.drawLines(tickPts, p);
                      c.restore();

                      // orbiting dots with trails
                      float[] sp = {0.8f, -0.55f, 1.15f};
                      for (int i = 0; i < 3; i++) {
                          for (int k = 0; k < 6; k++) {
                              double ang = t * sp[i] + i * 2.1 - k * 0.07 * Math.signum(sp[i]);
                              float x = cx + 272f * (float) Math.cos(ang), y = cy + 272f * (float) Math.sin(ang);
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(a(i == 1 ? W : G, 230 - k * 38));
                              c.drawCircle(x, y, 4.2f - k * 0.55f, p);
                          }
                      }

                      // target lock brackets
                      float lp = t % 7f;
                      if (lp < 2.6f) {
                          float sz = 150f - (lp / 2.6f) * 78f;
                          float ey = 862f, ln = 26f;
                          stroke(G, 3f);
                          for (int sx = -1; sx <= 1; sx += 2) {
                              for (int sy = -1; sy <= 1; sy += 2) {
                                  float px = cx + sx * sz, py = ey + sy * sz * 0.7f;
                                  c.drawLine(px, py, px - sx * ln, py, p);
                                  c.drawLine(px, py, px, py - sy * ln * 0.8f, p);
                              }
                          }
                          if (lp > 1.6f && ((int) (t * 6)) % 2 == 0) {
                              ctxt(c, "TARGET LOCKED", cx, ey + sz * 0.7f + 28, 15, G, true);
                          }
                      }
                  }

