      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HackWallpaper.apk
          gh release create "apk-${{ github.run_number }}" HackWallpaper.apk --repo "${{ github.repository }}" --title "Hack Wallpaper APK" --notes "Download HackWallpaper.apk and install"

      - uses: actions/upload-artifact@v4
        with:
          name: HackWallpaper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
