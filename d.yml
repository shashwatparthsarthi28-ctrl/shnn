          package com.shashwat.hackwall;

          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.PorterDuff;
          import android.graphics.PorterDuffXfermode;
          import android.graphics.Rect;

          /** Cuts the ring and the inner disc of the eye emblem out of the background plate (844x1863). */
          final class Emblem {
              private Emblem() {
              }

              static final int CX = 421;
              static final int CY = 850;
              static final int RING_R = 232; // half size of ring bitmap
              static final int INNER_R = 198; // half size of inner bitmap

              private static Bitmap cut(Bitmap plate, int half, boolean ring) {
                  int s = half * 2;
                  Bitmap out = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(out);
                  Paint m = new Paint(Paint.ANTI_ALIAS_FLAG);
                  m.setColor(0xFFFFFFFF);
                  if (ring) {
                      m.setStyle(Paint.Style.STROKE);
                      m.setStrokeWidth(32f);
                      c.drawCircle(half, half, 211f, m);
                  } else {
                      m.setStyle(Paint.Style.FILL);
                      c.drawCircle(half, half, 196f, m);
                  }
                  Paint p = new Paint(Paint.FILTER_BITMAP_FLAG);
                  p.setXfermode(new PorterDuffXfermode(PorterDuff.Mode.SRC_IN));
                  int px = Math.max(0, Math.min(plate.getWidth() - 1, CX));
                  Rect src = new Rect(CX - half, CY - half, CX + half, CY + half);
                  Rect dst = new Rect(0, 0, s, s);
                  if (plate.getWidth() != 844) {
                      float k = plate.getWidth() / 844f;
                      src = new Rect((int) ((CX - half) * k), (int) ((CY - half) * k),
                              (int) ((CX + half) * k), (int) ((CY + half) * k));
                  }
                  c.drawBitmap(plate, src, dst, p);
                  return out;
              }

              static Bitmap ring(Bitmap plate) {
                  return cut(plate, RING_R, true);
              }

              static Bitmap inner(Bitmap plate) {
                  return cut(plate, INNER_R, false);
              }
          }
