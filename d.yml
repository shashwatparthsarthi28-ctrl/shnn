                              Toast.makeText(MainActivity.this, "Saved", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(MainActivity.this, "Exactly 4 digits chahiye", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
                  root.addView(save);

                  root.addView(makeText("\nIsko apna asli phone PIN mat banana. Ye sirf is app ke andar ka show hai "
                          + "aur asli lock screen ko kuch nahi karta. Default: 1337.\n\n"
                          + "Steps: 1 -> 2 (Allow notifications) -> 3 (toggle ON karo) -> phone lock karke wake karo.\n"
                          + "Console se bahar nikalne ke liye EXIT ya Back dabao, phir asli unlock normal chalega.\n"
                          + "Settings > Apps > Hack Wallpaper > Battery > Unrestricted rakho.",
                          12, 0xFF8FBFA0, false));
                  setContentView(sv);
              }
          }
