                      p.setTextAlign(Paint.Align.LEFT);
                  }

                  void hexStrip(Canvas c, float t) {
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(null);
                      p.setTypeface(MONO);
                      p.setTextSize(9);
                      p.setTextAlign(Paint.Align.LEFT);
                      float sp = t * 7f;
                      int base = (int) sp;
                      float frac = sp - base;
                      char[] hx = new char[4];
                      for (int r = 0; r < 60; r++) {
                          int v = hash(base + r);
