              // =====================================================================================

              class ConsoleView extends View {
                  static final int S_BOOT = 0, S_SCAN = 1, S_PIN = 2, S_FAIL = 3, S_GRANTED = 4, S_HOME = 5;
                  static final int COLS = 24;
                  static final float DW = 844f, DH = 1863f;
                  static final float PIN_TIMEOUT = 20f;

                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint bp = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
                  final Path path = new Path();
                  final RectF rf = new RectF();
                  final Random rnd = new Random();
                  final Date date = new Date();
                  final SimpleDateFormat fmtHms = new SimpleDateFormat("HH:mm:ss", Locale.ENGLISH);
                  final SimpleDateFormat fmtTime = new SimpleDateFormat("HH:mm", Locale.ENGLISH);
                  final SimpleDateFormat fmtDate = new SimpleDateFormat("EEE dd MMM", Locale.ENGLISH);
                  final char[] buf = new char[1];

                  float sc = 1f, ox = 0f, oy = 0f;
                  int state = S_BOOT;
                  long stateAt, t0;
                  long simBase;
                  long wrongAt = -100000;
                  String pin = "";
                  int attempts = 3;
                  String failReason = "";
                  int battery = 78;

                  final float[] colOff = new float[COLS];
                  final float[] colSpeed = new float[COLS];
                  final int[] colLen = new int[COLS];

                  Bitmap innerBmp, ringBmp;
                  Shader beamShader, sweepShader, bandShader;

                  // buttons
                  final float[] bl = new float[24], bt = new float[24], br = new float[24], bb = new float[24];
                  final int[] bid = new int[24];
                  int bn = 0;
                  int pressed = -1;

                  // face mesh params
                  final float[] pr = new float[3];
                  float fcx, fcy, fA, fB, fyaw, freveal, fbeam, falpha;
                  boolean pv;
                  float qx, qy;

                  ConsoleView(Context ctx) {
                      super(ctx);
                      setBackgroundColor(Color.BLACK);
                      t0 = SystemClock.uptimeMillis();
                      stateAt = t0;
                      simBase = t0;
                      for (int i = 0; i < COLS; i++) {
                          colOff[i] = rnd.nextFloat() * 2000f;
                          colSpeed[i] = 55f + rnd.nextFloat() * 110f;
                          colLen[i] = 8 + rnd.nextInt(14);
                      }
                      beamShader = new LinearGradient(0, -30, 0, 30,
                              new int[]{0x0000FF66, 0x7000FF66, 0x0000FF66}, null, Shader.TileMode.CLAMP);
                      sweepShader = new SweepGradient(0, 0, new int[]{0x0000FF66, 0x5500FF66}, new float[]{0.6f, 1f});
                      bandShader = new LinearGradient(0, -34, 0, 34,
                              new int[]{0x0000FF66, 0x6000FF66, 0x0000FF66}, null, Shader.TileMode.CLAMP);
                      try {
                          BitmapFactory.Options o = new BitmapFactory.Options();
                          o.inScaled = false;
                          Bitmap plate = BitmapFactory.decodeResource(getResources(), R.drawable.bg_plate, o);
                          if (plate != null) {
                              innerBmp = Emblem.inner(plate);
                              ringBmp = Emblem.ring(plate);
                              plate.recycle();
                          }
                      } catch (Throwable ignored) {
                      }
                      try {
                          BatteryManager bm = (BatteryManager) ctx.getSystemService(Context.BATTERY_SERVICE);
                          if (bm != null) {
                              int l = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY);
                              if (l > 0) battery = l;
                          }
                      } catch (Exception ignored) {
                      }
                  }

                  @Override
                  protected void onSizeChanged(int w, int h, int ow, int oh) {
                      super.onSizeChanged(w, h, ow, oh);
                      sc = Math.min(w / DW, h / DH);
                      ox = (w - DW * sc) / 2f;
                      oy = (h - DH * sc) / 2f;
                  }

                  long now() {
                      return SystemClock.uptimeMillis();
                  }

                  void go(int s) {
                      state = s;
                      stateAt = now();
                  }

                  // ---------------- touch ----------------

                  int hitTest(float x, float y) {
                      for (int i = 0; i < bn; i++) {
                          if (x >= bl[i] && x <= br[i] && y >= bt[i] && y <= bb[i]) return bid[i];
                      }
                      return -1;
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      float x = (e.getX() - ox) / sc, y = (e.getY() - oy) / sc;
                      switch (e.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              pressed = hitTest(x, y);
                              if (pressed >= 0) performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP);
                              return true;
                          case MotionEvent.ACTION_UP:
                              int h = hitTest(x, y);
                              if (h >= 0 && h == pressed) onButton(h);
                              pressed = -1;
                              return true;
                          case MotionEvent.ACTION_CANCEL:
                              pressed = -1;
                              return true;
                          default:
                              return true;
                      }
                  }

                  void onButton(int id) {
                      if (id >= 100 && id <= 109) {
                          if (state == S_PIN && pin.length() < 4) {
                              pin += (char) ('0' + (id - 100));
                              if (pin.length() == 4) submitPin();
                          }
                          return;
                      }
                      switch (id) {
                          case 110:
                              if (pin.length() > 0) pin = pin.substring(0, pin.length() - 1);
                              break;
                          case 1:
                              simBase = now();
                              break;
                          case 2:
                              pin = "";
                              attempts = 3;
                              go(S_SCAN);
                              break;
                          case 3:
                              toggleTorch();
                              break;
                          case 4:
                              openDialer();
                              break;
                          case 5:
                              openCamera();
                              break;
                          case 6:
                              finish();
                              break;
                          default:
                              break;
                      }
                  }

                  void submitPin() {
                      if (pin.equals(passcode(getContext()))) {
                          go(S_GRANTED);
                      } else {
                          wrongAt = now();
                          pin = "";
                          attempts--;
                          if (attempts <= 0) {
                              failReason = "TOO MANY WRONG ATTEMPTS";
                              go(S_FAIL);
                          }
                      }
                  }

                  // ---------------- helpers ----------------

                  void txt(Canvas c, String s, float x, float y, float size, int color, boolean bold) {
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(null);
                      p.setTypeface(bold ? MONOB : MONO);
                      p.setTextSize(size);
                      p.setColor(color);
                      p.setTextAlign(Paint.Align.LEFT);
                      c.drawText(s, x, y, p);
                  }

                  void ctxt(Canvas c, String s, float x, float y, float size, int color, boolean bold) {
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(null);
                      p.setTypeface(bold ? MONOB : MONO);
                      p.setTextSize(size);
                      p.setColor(color);
                      p.setTextAlign(Paint.Align.CENTER);
                      c.drawText(s, x, y, p);
                      p.setTextAlign(Paint.Align.LEFT);
                  }

                  void rtxt(Canvas c, String s, float x, float y, float size, int color, boolean bold) {
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(null);
                      p.setTypeface(bold ? MONOB : MONO);
                      p.setTextSize(size);
                      p.setColor(color);
                      p.setTextAlign(Paint.Align.RIGHT);
                      c.drawText(s, x, y, p);
                      p.setTextAlign(Paint.Align.LEFT);
                  }

                  void stroke(int color, float w) {
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(w);
                      p.setColor(color);
                      p.setStrokeCap(Paint.Cap.BUTT);
                      p.setPathEffect(null);
                      p.setShader(null);
                  }

                  void box(Canvas c, float l, float t, float r, float b, int col) {
                      float k = 14;
                      path.reset();
                      path.moveTo(l, t);
                      path.lineTo(r - k, t);
                      path.lineTo(r, t + k);
                      path.lineTo(r, b);
                      path.lineTo(l + k, b);
                      path.lineTo(l, b - k);
                      path.close();
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(null);
                      p.setColor(0xCC001208);
                      c.drawPath(path, p);
                      stroke(col, 2f);
                      c.drawPath(path, p);
                      stroke(W, 3f);
                      c.drawLine(l, t, l + 22, t, p);
                      c.drawLine(l, t, l, t + 22, p);
                      c.drawLine(r, b, r - 22, b, p);
                      c.drawLine(r, b, r, b - 22, p);
                  }

                  void bar(Canvas c, float l, float t, float r, float b, float frac, int col) {
                      stroke(col, 1.5f);
                      c.drawRect(l, t, r, b, p);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(col);
                      float w = (r - l - 4) * clamp(frac, 0f, 1f);
                      c.drawRect(l + 2, t + 2, l + 2 + w, b - 2, p);
                  }

                  void addBtn(int id, float l, float t, float r, float b) {
                      if (bn < bid.length) {
                          bl[bn] = l;
                          bt[bn] = t;
                          br[bn] = r;
                          bb[bn] = b;
                          bid[bn] = id;
                          bn++;
                      }
                  }

                  void brackets(Canvas c, float cx, float cy, float hw, float hh, float len, int col, float w) {
                      stroke(col, w);
                      for (int sx = -1; sx <= 1; sx += 2) {
                          for (int sy = -1; sy <= 1; sy += 2) {
                              float x = cx + sx * hw, y = cy + sy * hh;
                              c.drawLine(x, y, x - sx * len, y, p);
                              c.drawLine(x, y, x, y - sy * len, p);
                          }
                      }
                  }

                  void button(Canvas c, int id, float l, float t, float r, float b, String label, int kind, int col) {
                      addBtn(id, l, t, r, b);
                      boolean pr2 = pressed == id;
                      rf.set(l, t, r, b);
                      p.setStyle(Paint.Style.FILL);
                      p.setShader(null);
                      p.setColor(pr2 ? a(col, 90) : 0xCC001208);
                      c.drawRoundRect(rf, 14, 14, p);
                      stroke(col, pr2 ? 3.5f : 2f);
                      c.drawRoundRect(rf, 14, 14, p);
                      float cy = (t + b) / 2f;
                      icon(c, kind, l + 52, cy, col);
                      txt(c, label, l + 96, cy + 7, 19, pr2 ? W : col, true);
                  }

                  void icon(Canvas c, int kind, float x, float y, int col) {
                      stroke(col, 3.2f);
                      p.setStrokeCap(Paint.Cap.ROUND);
                      switch (kind) {
                          case 0: // hack: terminal prompt
                              c.drawRoundRect(x - 20, y - 16, x + 20, y + 16, 5, 5, p);
                              c.drawLine(x - 11, y - 6, x - 3, y, p);
                              c.drawLine(x - 3, y, x - 11, y + 6, p);
                              c.drawLine(x + 1, y + 7, x + 11, y + 7, p);
                              break;
                          case 1: // face
                              c.drawCircle(x, y, 18, p);
                              c.drawPoint(x - 7, y - 5, p);
                              c.drawPoint(x + 7, y - 5, p);
                              rf.set(x - 9, y - 2, x + 9, y + 11);
                              c.drawArc(rf, 20, 140, false, p);
                              break;
                          case 2: // torch
                              c.drawRoundRect(x - 7, y - 4, x + 7, y + 20, 4, 4, p);
                              c.drawLine(x - 12, y - 18, x + 12, y - 18, p);
                              c.drawLine(x - 12, y - 18, x - 7, y - 4, p);
                              c.drawLine(x + 12, y - 18, x + 7, y - 4, p);
                              break;
                          case 3: // call
                              rf.set(x - 14, y - 16, x + 16, y + 16);
                              c.drawArc(rf, 110, 140, false, p);
                              break;
                          case 4: // camera
                              c.drawRoundRect(x - 20, y - 11, x + 20, y + 15, 5, 5, p);
                              c.drawCircle(x, y + 2, 8, p);
                              c.drawLine(x - 8, y - 11, x - 5, y - 17, p);
                              c.drawLine(x - 5, y - 17, x + 5, y - 17, p);
                              break;
                          case 5: // exit
                              c.drawLine(x - 12, y - 12, x + 12, y + 12, p);
                              c.drawLine(x + 12, y - 12, x - 12, y + 12, p);
                              break;
                          default: // retry
                              rf.set(x - 15, y - 15, x + 15, y + 15);
                              c.drawArc(rf, -40, 280, false, p);
                              c.drawLine(x + 11, y - 15, x + 15, y - 7, p);
                              c.drawLine(x + 11, y - 15, x + 3, y - 12, p);
                              break;
                      }
                      p.setStrokeCap(Paint.Cap.BUTT);
                  }

                  // ---------------- background / header ----------------

                  void drawBase(Canvas c, float t, long wall, int accent) {
                      c.drawColor(Color.BLACK);
                      c.save();
                      c.translate(ox, oy);
                      c.scale(sc, sc);

                      stroke(a(accent, 14), 1f);
                      for (int x = 0; x <= 844; x += 60) c.drawLine(x, 0, x, DH, p);
                      for (int y = 0; y <= 1863; y += 60) c.drawLine(0, y, DW, y, p);

                      p.setStyle(Paint.Style.FILL);
                      p.setShader(null);
                      p.setTypeface(MONO);
                      p.setTextSize(19);
                      p.setTextAlign(Paint.Align.CENTER);
                      float step = 21f, colW = DW / COLS;
                      for (int i = 0; i < COLS; i++) {
                          float x = colW * i + colW / 2f;
                          int len = colLen[i];
                          float span = DH + len * step;
                          float head = (t * colSpeed[i] + colOff[i]) % span;
                          int row = (int) (head / step);
                          for (int k = 0; k < len; k++) {
                              int r = row - k;
                              float y = r * step;
                              if (y < 95 || y > 1860) continue;
                              float f = 1f - (float) k / len;
                              int al = (k == 0) ? 120 : (int) (f * f * 55);
                              int hs = hash(i * 977 + r * 131 + (k == 0 ? (int) (t * 8) : 0));
                              buf[0] = RAIN.charAt((hs >>> 3) % RAIN.length());
                              p.setColor(a(k == 0 ? 0xFFB8FFD0 : accent, al));
                              c.drawText(buf, 0, 1, x, y, p);
                          }
                      }
                      p.setTextAlign(Paint.Align.LEFT);

                      // header
                      if (((int) (t * 2)) % 2 == 0) {
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(accent);
                          c.drawCircle(40, 62, 4f, p);
                      }
                      txt(c, "// SECURE TERMINAL v9.4", 54, 68, 16, accent, false);
                      date.setTime(wall);
                      rtxt(c, fmtHms.format(date) + "   PWR " + battery + "%", 810, 68, 16, W, false);
                      stroke(a(accent, 160), 1.5f);
                      c.drawLine(30, 84, 814, 84, p);
                  }

                  void endBase(Canvas c, float t) {
                      // scanlines + moving beam + flicker
                      p.setStyle(Paint.Style.STROKE);
                      p.setShader(null);
                      p.setStrokeWidth(1f);
                      p.setColor(0x22000000);
                      for (float y = 0; y < DH; y += 4f) c.drawLine(0, y, DW, y, p);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(a(Color.BLACK, rnd.nextInt(14)));
                      c.drawRect(0, 0, DW, DH, p);
                      c.restore();
                  }

                  // ---------------- main draw ----------------

                  @Override
                  protected void onDraw(Canvas c) {
                      long n = now();
                      float t = (n - t0) / 1000f;
                      float ts = (n - stateAt) / 1000f;
                      long wall = System.currentTimeMillis();
                      bn = 0;

                      if (state == S_BOOT) {
                          drawBase(c, t, wall, G);
                          drawBoot(c, ts);
                          endBase(c, t);
                          if (ts > 1.7f) go(S_SCAN);
                      } else if (state == S_SCAN) {
                          drawBase(c, t, wall, G);
                          drawScan(c, ts);
                          endBase(c, t);
                      } else if (state == S_PIN) {
                          drawBase(c, t, wall, G);
                          drawPin(c, t, ts);
                          endBase(c, t);
                      } else if (state == S_FAIL) {
                          drawBase(c, t, wall, RED);
                          drawFail(c, t, ts);
                          endBase(c, t);
                      } else if (state == S_GRANTED) {
                          drawBase(c, t, wall, G);
                          drawGranted(c, ts);
                          endBase(c, t);
                          if (ts > 2.4f) go(S_HOME);
                      } else {
                          drawBase(c, t, wall, G);
                          drawHome(c, t, wall);
                          endBase(c, t);
                      }
                      postInvalidateOnAnimation();
                  }

                  // ---------------- BOOT ----------------

                  void drawBoot(Canvas c, float ts) {
                      String[] ln = {"> mounting secure enclave...", "> loading neural face engine...",
                              "> calibrating depth sensor...", "> handshake with kernel...", "> READY"};
                      for (int i = 0; i < ln.length; i++) {
                          if (ts > i * 0.3f) txt(c, ln[i], 60, 700 + i * 34f, 20, i == 4 ? G : W, i == 4);
                      }
                      bar(c, 60, 900, 784, 918, ts / 1.6f, G);
                      ctxt(c, "BOOTING", 422, 960, 24, G, true);
                  }

                  // ---------------- FACE ----------------

                  void proj(float lat, float lon) {
                      float la = (float) Math.toRadians(lat);
                      float lo = (float) Math.toRadians(lon) + fyaw;
                      float cl = (float) Math.cos(la);
                      float sl = (float) Math.sin(la);
                      float aa = fA * (1f - 0.26f * Math.max(0f, -sl));
                      pr[0] = fcx + aa * cl * (float) Math.sin(lo);
                      pr[1] = fcy - fB * sl;
                      pr[2] = cl * (float) Math.cos(lo);
                  }

                  void segDraw(Canvas c, float x1, float y1, float x2, float y2, float boost) {
                      float my = (y1 + y2) / 2f;
                      float rv = fcy - fB + freveal * 2f * fB * 1.05f;
                      if (my > rv) return;
                      float k = clamp((rv - my) / 40f, 0f, 1f);
                      float al = (55f + boost) * k * falpha;
                      if (fbeam >= 0f) {
                          float d = (my - fbeam) / 38f;
                          al += 150f * (float) Math.exp(-d * d) * k * falpha;
                      }
                      p.setColor(a(G, (int) al));
                      c.drawLine(x1, y1, x2, y2, p);
                  }

                  void pl(Canvas c, float lat, float lon, boolean first, float boost) {
                      if (first) pv = false;
                      proj(lat, lon);
                      if (pr[2] > 0.04f) {
                          if (pv) segDraw(c, qx, qy, pr[0], pr[1], boost);
                          qx = pr[0];
                          qy = pr[1];
                          pv = true;
                      } else {
                          pv = false;
                      }
                  }

                  void drawFace(Canvas c) {
                      p.setShader(null);
                      p.setStyle(Paint.Style.STROKE);
                      p.setPathEffect(null);
                      p.setStrokeWidth(1.3f);
                      for (int lat = -75; lat <= 75; lat += 15)
                          for (int lon = -90; lon <= 90; lon += 6) pl(c, lat, lon, lon == -90, 0f);
                      for (int lon = -90; lon <= 90; lon += 18)
                          for (int lat = -85; lat <= 85; lat += 8) pl(c, lat, lon, lat == -85, 0f);

                      p.setStrokeWidth(2.4f);
                      for (int s = -1; s <= 1; s += 2) {
                          for (int k = 0; k <= 24; k++) {
                              double u = k * Math.PI * 2 / 24;
                              pl(c, 12f + 4.5f * (float) Math.sin(u), s * 30f + 12f * (float) Math.cos(u), k == 0, 160f);
                          }
                          for (int k = 0; k <= 8; k++) {
                              pl(c, 23f + 4f * (float) Math.sin(k / 8.0 * Math.PI), s * (12f + k * 4.2f), k == 0, 140f);
                          }
                          for (int k = 0; k <= 6; k++) {
                              pl(c, 10f - k * 4f, s * (5f + (k > 4 ? (k - 4) * 3f : 0f)), k == 0, 130f);
                          }
                      }
                      for (int k = 0; k <= 8; k++) pl(c, 14f - k * 3.75f, 0f, k == 0, 130f);
                      for (int k = 0; k <= 10; k++) {
                          float lon = -10f + k * 2f;
                          pl(c, -18f - 0.03f * lon * lon, lon, k == 0, 130f);
                      }
                      for (int k = 0; k <= 8; k++) {
                          float lon = -24f + k * 6f;
                          pl(c, -42f + 0.0105f * lon * lon, lon, k == 0, 150f);
                      }
                      for (int k = 0; k <= 6; k++) {
                          float lon = -18f + k * 6f;
                          pl(c, -46f + 0.008f * lon * lon, lon, k == 0, 120f);
                      }

                      // landmark dots
                      p.setStyle(Paint.Style.FILL);
                      float rv = fcy - fB + freveal * 2f * fB * 1.05f;
                      for (int lat = -60; lat <= 60; lat += 20) {
                          for (int lon = -60; lon <= 60; lon += 20) {
                              proj(lat, lon);
                              if (pr[2] < 0.1f || pr[1] > rv) continue;
                              float al = 200f * falpha * Math.min(1f, pr[2] * 1.5f);
                              p.setColor(a(W, (int) al));
                              c.drawCircle(pr[0], pr[1], 2.6f, p);
                          }
                      }
                      // iris dots
                      for (int s = -1; s <= 1; s += 2) {
                          proj(12f, s * 30f);
                          if (pr[2] > 0.1f && pr[1] < rv) {
                              p.setColor(a(G, (int) (255 * falpha)));
                              c.drawCircle(pr[0], pr[1], 4f, p);
