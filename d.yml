          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              SharedPreferences sp;
              Button autoBtn;
              EditText pinEdit;

              void startControls() {
                  Intent i = new Intent(this, HackNotifService.class).setAction(HackNotifService.A_START);
                  startForegroundService(i);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  startControls();
              }

              Button makeButton(String label, int bg) {
                  Button bt = new Button(this);
                  bt.setText(label);
                  bt.setTextColor(Color.BLACK);
                  bt.setBackgroundColor(bg);
                  bt.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = 22;
                  bt.setLayoutParams(lp);
                  return bt;
              }

              TextView makeText(String s, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(color);
                  t.setTextSize(size);
                  t.setTypeface(Typeface.MONOSPACE, bold ? Typeface.BOLD : Typeface.NORMAL);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(0, 14, 0, 6);
                  return t;
              }

              void refreshAutoBtn() {
                  boolean on = sp.getBoolean("autopop", false);
                  autoBtn.setText(on ? "[ AUTO POP ON  (tap to turn off) ]" : "[ AUTO POP OFF  (tap to turn on) ]");
                  autoBtn.setBackgroundColor(on ? 0xFF00FF66 : 0xFF557766);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences(ConsoleActivity.PREFS, MODE_PRIVATE);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(Color.BLACK);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(48, 90, 48, 90);
                  sv.addView(root);

                  root.addView(makeText("> HACK WALLPAPER v2", 26, 0xFF00FF66, true));
                  root.addView(makeText("Live wallpaper + lock screen console with face scan simulation.\n"
                          + "Sab kuch sirf visual simulation hai. Isse phone ka asli lock nahi badalta.",
                          14, 0xFFB8F5CC, false));

                  Button set = makeButton("[ 1. SET LIVE WALLPAPER ]", 0xFF00FF66);
                  set.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          try {
                              Intent i = new Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER);
                              i.putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,
                                      new ComponentName(MainActivity.this, HackWallpaperService.class));
                              startActivity(i);
                          } catch (Exception e) {
                              startActivity(new Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER));
                          }
                      }
                  });

                  Button ctl = makeButton("[ 2. START LOCK SCREEN CONTROLS ]", 0xFF00FF66);
                  ctl.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          sp.edit().putBoolean("autopop", true).apply();
                          refreshAutoBtn();
                          if (Build.VERSION.SDK_INT >= 33
                                  && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                                  != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                          } else {
                              startControls();
                          }
                      }
                  });

                  Button fsi = makeButton("[ 3. ALLOW LOCK SCREEN POPUP ]", 0xFF00FF66);
                  fsi.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          try {
                              if (Build.VERSION.SDK_INT >= 34) {
                                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                                  if (nm.canUseFullScreenIntent()) {
                                      Toast.makeText(MainActivity.this, "Already allowed", Toast.LENGTH_SHORT).show();
                                      return;
                                  }
                                  Intent i = new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT,
                                          Uri.parse("package:" + getPackageName()));
                                  startActivity(i);
                              } else {
                                  Toast.makeText(MainActivity.this, "Is Android version pe zarurat nahi", Toast.LENGTH_SHORT).show();
                              }
                          } catch (Exception e) {
                              Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                      Uri.parse("package:" + getPackageName()));
                              startActivity(i);
                          }
                      }
                  });

                  autoBtn = makeButton("", 0xFF00FF66);
                  autoBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          sp.edit().putBoolean("autopop", !sp.getBoolean("autopop", false)).apply();
                          refreshAutoBtn();
                      }
                  });
                  refreshAutoBtn();

                  Button test = makeButton("[ TEST CONSOLE + FACE SCAN NOW ]", 0xFFE6FFEE);
                  test.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          startActivity(new Intent(MainActivity.this, ConsoleActivity.class));
                      }
                  });

                  root.addView(set);
                  root.addView(ctl);
                  root.addView(fsi);
                  root.addView(autoBtn);
                  root.addView(test);

                  root.addView(makeText("\nFAKE PASSCODE (4 digits)", 14, 0xFF00FF66, true));
                  pinEdit = new EditText(this);
                  pinEdit.setInputType(InputType.TYPE_CLASS_NUMBER);
                  pinEdit.setFilters(new InputFilter[]{new InputFilter.LengthFilter(4)});
                  pinEdit.setText(ConsoleActivity.passcode(this));
                  pinEdit.setTextColor(0xFF00FF66);
                  pinEdit.setGravity(Gravity.CENTER);
                  pinEdit.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  pinEdit.setTextSize(24);
                  root.addView(pinEdit);
                  Button save = makeButton("[ SAVE PASSCODE ]", 0xFF00FF66);
                  save.setOnClickListener(new View.OnClickListener() {
                      @Override
